
name: Deploy Database Data to Redis

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Deploy Docker Image to Render
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  load-data:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Redis Cloud connection
        env:
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_USER: ${{ secrets.REDIS_USER }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          docker run --rm \
            -e REDISCLI_AUTH="$REDIS_PASSWORD" \
            redis:7-alpine \
            redis-cli \
              -h "$REDIS_HOST" \
              -p "$REDIS_PORT" \
              --user "$REDIS_USER" \
              PING

      - name: Load initial data through API
        env:
          API_URL: https://bd2-lab01-redis-api.onrender.com
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 5 \
            --max-time 90 "$API_URL/Todos")

          echo "$response" | jq .

          echo "$response" | jq -e '.myTodos | length == 3' > /dev/null

      - name: Verify Redis cache
        env:
          API_URL: https://bd2-lab01-redis-api.onrender.com
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 18 --retry-all-errors --retry-delay 5 \
            --max-time 90 "$API_URL/Todos")

          echo "$response" | jq .

          echo "$response" | jq -e '.isCached == true' > /dev/null

          echo "Redis cache successfully populated."
